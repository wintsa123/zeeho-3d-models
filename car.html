<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141218" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f2fa" media="(prefers-color-scheme: light)">
<meta name="description" content="极核 AE5/3.0.6：车辆设置、车机壁纸与 OTA">
<meta name="build" content="2026-10-24">
<title>极核车辆 · 设置 / 壁纸 / OTA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237457b8'/%3E%3Cpath d='M18 5 9 18h5l-1.4 9L22 14h-5.2z' fill='%23e7ddff'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #141218; --surface: #1d1b22; --surface-2: #26232c; --line: #35313d;
    --ink: #e9e4f0; --ink-dim: #b0a9bd; --ink-faint: #837b91;
    --accent: #b9a3f0; --accent-ink: #1a1024; --ok: #74d99f; --warn: #f3c677; --danger: #ff8f8a;
    --radius: 14px; --radius-sm: 10px;
  }
  :root[data-theme="light"] {
    --bg: #f6f2fa; --surface: #ffffff; --surface-2: #f1ecf8; --line: #e0d8ec;
    --ink: #211d29; --ink-dim: #5c5468; --ink-faint: #8b8299;
    --accent: #6f4fc0; --accent-ink: #ffffff; --ok: #1f8a52; --warn: #a86a00; --danger: #c22f2a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    padding-bottom: calc(76px + env(safe-area-inset-bottom));
  }
  a { color: var(--accent); }
  h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: .01em; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* ---- 顶栏 ---- */
  .topbar {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px;
    padding: 10px 12px calc(10px); background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
  }
  .topbar .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .mark { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 700; flex: none; }
  .brand { min-width: 0; }
  .brand > div { min-width: 0; }
  .brand h1 { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand p { margin: 0; font-size: 11px; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spacer { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px;
    background: var(--surface-2); color: var(--ink-dim); font-size: 11px; white-space: nowrap; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-faint); }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--danger); }
  .iconbtn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 9px;
    padding: 5px 9px; font-size: 12px; cursor: pointer; }
  .iconbtn:active { transform: scale(.97); }
  @media (max-width: 560px) {
    .topbar { flex-wrap: wrap; row-gap: 6px; }
    .topbar .brand { flex: 1 1 100%; }
    .topbar .spacer { display: none; }
    .topbar #state-pill { order: 5; }
    .brand h1 { font-size: 14px; }
  }

  /* ---- 车辆条 ---- */
  .vehiclebar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .vehiclebar select { flex: 1; min-width: 0; background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 7px 9px; font-size: 13px; }
  .vehiclebar .meta { font-size: 11px; color: var(--ink-faint); white-space: nowrap; }

  /* ---- 视图 ---- */
  main { padding: 12px; display: grid; gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .card-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 6px; }
  .card-head h2 { font-size: 14px; }
  .card-head .sub { font-size: 11px; color: var(--ink-faint); }
  .card-body { padding: 8px 14px 14px; }
  .hint { font-size: 11.5px; color: var(--ink-faint); line-height: 1.6; }
  .empty { padding: 22px 14px; text-align: center; color: var(--ink-faint); font-size: 13px; }

  /* ---- 设置磁贴 ---- */
  .tile-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tile { text-align: left; display: grid; gap: 4px; padding: 12px; border-radius: var(--radius-sm);
    background: var(--surface-2); border: 1px solid transparent; color: inherit; cursor: pointer; font: inherit; }
  .tile:active { transform: scale(.985); }
  .tile.dim { opacity: .55; }
  .tile b { font-size: 13.5px; font-weight: 600; }
  .tile span { font-size: 11px; color: var(--ink-faint); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tile em { font-style: normal; font-size: 10.5px; color: var(--accent); }

  /* ---- 设置项 ---- */
  .item { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item .txt { min-width: 0; flex: 1; }
  .item .txt b { display: block; font-size: 13.5px; font-weight: 550; }
  .item .txt small { color: var(--ink-faint); font-size: 11px; }
  .item.locked .txt b { color: var(--ink-faint); }
  .switch { position: relative; width: 46px; height: 27px; border-radius: 999px; background: var(--surface-2);
    border: 1px solid var(--line); cursor: pointer; flex: none; transition: background .16s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 19px; height: 19px; border-radius: 50%;
    background: var(--ink-faint); transition: transform .16s, background .16s; }
  .switch[aria-checked="true"] { background: color-mix(in srgb, var(--accent) 34%, var(--surface-2)); border-color: var(--accent); }
  .switch[aria-checked="true"]::after { transform: translateX(19px); background: var(--accent); }
  .switch[disabled] { opacity: .45; cursor: not-allowed; }
  .val { font-size: 13px; color: var(--ink-dim); min-width: 42px; text-align: right; flex: none; }
  select.ctl, input.ctl { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 8px; font-size: 12.5px; max-width: 44vw; }
  input.ctl[type="range"] { padding: 0; width: 40vw; accent-color: var(--accent); }
  .badge { font-size: 10px; padding: 1px 6px; border-radius: 999px; background: var(--surface-2); color: var(--ink-faint); }

  /* ---- 壁纸 ---- */
  .wall-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 10px; }
  .wall { position: relative; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--line);
    background: var(--surface-2); aspect-ratio: 16 / 9; cursor: pointer; padding: 0; color: inherit; }
  .wall img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .wall .ph { display: grid; place-items: center; height: 100%; color: var(--ink-faint); font-size: 11px; padding: 8px; text-align: center; }
  .wall .tag { position: absolute; left: 6px; top: 6px; font-size: 10px; padding: 1px 6px; border-radius: 999px;
    background: #0009; color: #fff; backdrop-filter: blur(4px); }
  .wall .tag.on { background: var(--accent); color: var(--accent-ink); }
  .wall .name { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 8px 6px; font-size: 11px;
    background: linear-gradient(transparent, #000a); color: #fff; text-align: left;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .progress { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }

  /* ---- OTA ---- */
  .kv { display: grid; grid-template-columns: 92px 1fr; gap: 7px 10px; font-size: 12.5px; }
  .kv dt { color: var(--ink-faint); }
  .kv dd { margin: 0; word-break: break-all; }
  .rowline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }

  /* ---- 按钮 ---- */
  .btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px;
    padding: 8px 12px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  .btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); }
  .btn.ghost { background: transparent; }
  .btn.small { padding: 5px 9px; font-size: 12px; border-radius: 8px; }
  .btn[disabled] { opacity: .5; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

  /* ---- 底部 tab ---- */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex;
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); gap: 4px;
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px);
    border-top: 1px solid var(--line); }
  .tabbar button { flex: 1; border: 0; background: transparent; color: var(--ink-faint); font: inherit;
    font-size: 11.5px; padding: 7px 2px; border-radius: 10px; cursor: pointer; display: grid; gap: 2px; place-items: center; }
  .tabbar button[aria-selected="true"] { color: var(--accent); background: var(--surface-2); }
  .tabbar button svg { width: 19px; height: 19px; }

  /* ---- 弹层 ---- */
  dialog { border: 0; padding: 0; background: transparent; color: inherit; max-width: 100vw; max-height: 100vh; }
  dialog::backdrop { background: #0009; backdrop-filter: blur(2px); }
  .sheet { width: min(560px, 100vw); max-height: 86vh; display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px 18px 0 0;
    margin: 14vh auto 0; }
  @media (min-width: 640px) { .sheet { border-radius: 18px; margin-top: 8vh; } }
  .sheet-head { display: flex; align-items: flex-start; gap: 8px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  .sheet-head h2 { font-size: 15px; }
  .sheet-head p { margin: 2px 0 0; font-size: 11.5px; color: var(--ink-faint); }
  .sheet-body { padding: 4px 16px 8px; overflow: auto; flex: 1; }
  .sheet-foot { padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line);
    display: flex; gap: 8px; align-items: center; }
  textarea { width: 100%; min-height: 132px; background: var(--surface-2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: 12px/1.5 ui-monospace, monospace; }
  .field { display: grid; gap: 5px; margin-bottom: 10px; }
  .field label { font-size: 11.5px; color: var(--ink-faint); }
  .field input, .field select { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 10px; font: inherit; font-size: 13px; }
  .checkline { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: var(--ink-dim); }
  .checkline input { margin-top: 2px; }
  .notice { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: var(--radius);
    background: color-mix(in srgb, var(--warn) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 34%, var(--line)); }
  .notice b { font-size: 13px; }
  .notice p { margin: 2px 0 0; font-size: 11.5px; color: var(--ink-dim); }
  .toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translate(-50%, 12px);
    background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); padding: 9px 14px;
    border-radius: 999px; font-size: 12.5px; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 60; max-width: 86vw; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .log { font: 11px/1.55 ui-monospace, monospace; white-space: pre-wrap; word-break: break-all; color: var(--ink-dim); }
  details.raw summary { cursor: pointer; font-size: 12px; color: var(--ink-faint); padding: 6px 0; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="mark">Z</div>
    <div>
      <h1>车辆 · 设置 / 壁纸 / OTA</h1>
      <p id="brand-sub">App 3.0.6 · 复用面板登录态</p>
    </div>
  </div>
  <div class="spacer"></div>
  <span class="pill" id="state-pill"><span class="dot" id="state-dot"></span><span id="state-text">检测中</span></span>
  <button class="iconbtn" id="btn-theme" type="button" title="深浅色">深浅</button>
  <button class="iconbtn" id="btn-log" type="button" title="请求日志">日志</button>
  <button class="iconbtn" id="btn-settings" type="button" title="连接设置">设置</button>
  <a class="iconbtn" href="./index.html" title="返回面板">面板</a>
</header>

<div class="vehiclebar">
  <select id="vin-select" aria-label="选择车辆"><option value="">（未加载车辆）</option></select>
  <span class="meta" id="vin-meta">—</span>
  <button class="iconbtn" id="btn-refresh" type="button">刷新</button>
</div>

<main id="view"></main>

<nav class="tabbar" role="tablist" aria-label="页面切换">
  <button type="button" role="tab" data-tab="settings" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
    车辆设置
  </button>
  <button type="button" role="tab" data-tab="wallpaper" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="12" rx="2"/><path d="M7 20h10"/><circle cx="9" cy="9.5" r="1.4"/><path d="M5 15l4-3.5 3.5 3 2.5-2 4 3"/></svg>
    车机壁纸
  </button>
  <button type="button" role="tab" data-tab="ota" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v10"/><path d="M8 10l4 4 4-4"/><path d="M5 17.5c0 1.4 1.1 2.5 2.5 2.5h9c1.4 0 2.5-1.1 2.5-2.5"/></svg>
    OTA 升级
  </button>
</nav>

<dialog id="sheet">
  <div class="sheet">
    <div class="sheet-head">
      <div style="flex:1;min-width:0">
        <h2 id="sheet-title">—</h2>
        <p id="sheet-sub"></p>
      </div>
      <button class="iconbtn" id="sheet-close" type="button">关闭</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
    <div class="sheet-foot" id="sheet-foot"></div>
  </div>
</dialog>

<dialog id="settings-dialog">
  <div class="sheet">
    <div class="sheet-head">
      <div style="flex:1"><h2>连接设置</h2><p>面板签名优先；没有面板时用自填凭据</p></div>
      <button class="iconbtn" id="settings-close" type="button">关闭</button>
    </div>
    <div class="sheet-body">
      <div class="field">
        <label for="cfg-mode">签名方式</label>
        <select id="cfg-mode">
          <option value="panel">复用面板签名（同目录 index.html）</option>
          <option value="own">自填 appId / appSecret</option>
        </select>
      </div>
      <div class="field"><label for="cfg-base">网关 BASE</label><input id="cfg-base" placeholder="https://tapi.zeehoev.com"></div>
      <div class="field"><label for="cfg-appid">appId</label><input id="cfg-appid" placeholder="App 3.0.6 AppConfig"></div>
      <div class="field"><label for="cfg-secret">appSecret（只存本标签页）</label><input id="cfg-secret" type="password" placeholder="不随仓库分发"></div>
      <div class="field"><label for="cfg-token">Bearer token</label><input id="cfg-token" placeholder="面板登录后自动同步；也可粘贴"></div>
      <div class="field"><label for="cfg-uid">userId（carSet 时用，可留空）</label><input id="cfg-uid" placeholder="面板模式会自动取"></div>
      <p class="hint">token 与面板共用 <span class="mono">zeeho.token</span>；在面板用手机号登录一次，这里刷新即可。</p>
      <div class="btnrow">
        <button class="btn primary" id="cfg-save" type="button">保存</button>
        <button class="btn" id="cfg-open-panel" type="button">打开面板登录</button>
        <button class="btn ghost" id="cfg-clear" type="button">清除 token</button>
      </div>
    </div>
  </div>
</dialog>

<dialog id="confirm-dialog">
  <div class="sheet" style="margin-top:22vh">
    <div class="sheet-head"><div style="flex:1"><h2 id="cf-title">确认</h2><p id="cf-sub"></p></div></div>
    <div class="sheet-body" id="cf-body"></div>
    <div class="sheet-foot">
      <label class="checkline" style="flex:1"><input type="checkbox" id="cf-check"><span>我确认这是写操作，会改到车</span></label>
      <button class="btn" id="cf-cancel" type="button">取消</button>
      <button class="btn primary" id="cf-ok" type="button" disabled>执行</button>
    </div>
  </div>
</dialog>

<dialog id="log-dialog">
  <div class="sheet">
    <div class="sheet-head"><div style="flex:1"><h2>请求日志</h2><p>最近的请求与错误（不含 token）</p></div><button class="iconbtn" id="log-close" type="button">关闭</button></div>
    <div class="sheet-body"><div class="log" id="log-body">（空）</div></div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
import { createBridge, pickVehicle, toBool, buildUrl } from './sdk/bridge.js';
import {
  CONTROL, buildSettingsModel, buildWriteBody, coerceValue, summarize,
} from './sdk/vehicle-settings.js';
import {
  normalizeWallpaperPage, normalizeWallpaperDetail, wallpapersFromHome, wallpaperImages,
  normalizeProgress, buildUseWallpaperBody, parseJsonField,
  normalizeOtaInfo, normalizeCheckVersion, normalizeOtaList, normalizeOtaRecord,
  normalizeOtaStatus, maskSignedUrl, formatBytes,
} from './sdk/vehicle-media.js';

/* ============================ 端点表 ============================ */
/** panelTag 有值 = 面板认识这个接口，面板模式下可以直接 API.call（不对就退回签名请求）。 */
const EP = {
  vehicles:      { path: '/v1.0/app/cfmotoserverapp/vehicle/list', panelTag: 'vehicle_list' },
  home:          { path: '/v1.0/app/cfmotoserverapp/vehicleHomePageV2/{vin}', panelTag: 'vehicle_home' },
  carSet:        { path: '/v1.0/app/cfmotoserverapp/carSet', panelTag: 'vehicle_props' },
  setItems:      { path: '/v1.0/app/cfmotoserverapp/vehicleSet/items', panelTag: 'vehicle_set_items' },
  setItemsV2:    { path: '/v1.0/app/cfmotoserverapp/vehicleSet/itemsV2' },
  setInfo:       { path: '/v1.0/app/cfmotoserverapp/vehicleSet/vehicleSetInfo/{vin}', panelTag: 'vehicle_set_info' },
  btCodes:       { path: '/v1.0/app/cfmotoserverapp/vehicleSet/blueToothServiceCode' },
  chargePower:   { path: '/v1.0/app/cfmotoserverapp/vehicleSet/chargePower/options' },
  addSet:        { path: '/v1.0/app/cfmotoserverapp/vehicleSet/addVehicleSet', method: 'POST' },
  propOne:       { path: '/v1.0/app/cfmotoserverapp/vehicleSet/propertyOne/one', method: 'PUT' },
  propTwo:       { path: '/v1.0/app/cfmotoserverapp/vehicleSet/propertyTwo/one', method: 'PUT' },
  motoPlay:      { path: '/v1.0/app/cfmotoserverapp/vehicleSet/motoPlay/one', method: 'PUT' },
  lowPowerRule:  { path: '/v1.0/app/cfmotoserverapp/vehicleSet/lowPowerRule/one', method: 'PUT' },

  wallPage:      { path: '/v1.0/app/cfmotoserverapp/vehicle/wallpaper/pageVehicleWallpaper' },
  wallCount:     { path: '/v1.0/app/cfmotoserverapp/vehicle/wallpaper/getUserWallpaperCount' },
  wallDetail:    { path: '/v1.0/app/cfmotoserverapp/vehicle/wallpaper/vehicleWallpaperDetail/{id}' },
  wallUse:       { path: '/v1.0/app/cfmotoserverapp/vehicle/wallpaper/useWallpaper', method: 'POST' },
  wallDelete:    { path: '/v1.0/app/cfmotoserverapp/vehicle/wallpaper/deleteWallpaperV2/{id}', method: 'DELETE' },
  wallProgress:  { path: '/v1.0/app/cfmotoserverapp/vehicle/wallpaper/useWallpaperProgress/{recordId}' },
  wallSave:      { path: '/v1.0/app/cfmotoserverapp/vehicle/wallpaper/save', method: 'POST' },
  // 官方 534 条清单里是 POST；早期抓包文档记的是 PUT，所以 UI 上留了方法切换。
  wallUpdate:    { path: '/v1.0/app/cfmotoserverapp/vehicle/wallpaper/update/{id}', method: 'POST' },

  checkVersion:  { path: '/v1.0/app/cfmotoserverapp/checkVersion' },
  otaInfo:       { path: '/v1.0/app/cfmotoserverapp/ota/mmi/info/v2' },
  otaStatus:     { path: '/v1.0/app/cfmotoserverapp/ota/mmi/status' },
  otaList:       { path: '/v1.0/app/cfmotoserverapp/ota/list' },

/* ============================ 基础 ============================ */
const $ = (id) => document.getElementById(id);
const bridge = createBridge({
  onStatus: (kind, text) => setState(kind === 'warn' ? 'warn' : 'ok', text),
});

const state = {
  tab: 'settings',
  vehicles: [],
  vin: '',
  uid: '',
  home: null,
  summary: null,
  settings: null,           // { model, itemsV2, items, info, bt, loadedAt }
  wallpaper: { list: [], total: 0, count: null, builtin: [], meta: null, progress: null, loaded: false },
  ota: { info: null, check: null, list: null, record: null, status: null, content: null, loadedAt: 0 },
  logs: [],
  busy: {},
};

const esc = (text) => String(text ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

function toast(message, ms = 2400) {
  const el = $('toast');
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.remove('show'), ms);
}

function setState(kind, text) {
  const dot = $('state-dot');
  dot.className = `dot ${kind === 'ok' ? 'ok' : kind === 'bad' ? 'bad' : kind === 'warn' ? 'warn' : ''}`;
  $('state-text').textContent = text;
}

function logLine(text, bad = false) {
  const stamp = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  state.logs.unshift(`${stamp} ${bad ? '✗' : '·'} ${text}`);
  state.logs = state.logs.slice(0, 60);
  if ($('log-body')) $('log-body').textContent = state.logs.join('\n') || '（空）';
}

function fmtTime(iso) {
  if (!iso) return '';
  return String(iso).replace('T', ' ').replace(/\..*$/, '').replace(/[+-]\d{4}$/, '');
}

/** 官方 App 的 upgradeStatus 是数字枚举（文档没写全，这里按 3.0.6 抓包语义补）。 */
const OTA_STATUS_TEXT = { 0: '待升级', 1: '下载中', 2: '升级中', 3: '升级成功', 4: '升级失败' };
function otaStatusText(value) {
  if (value === undefined || value === null || value === '') return '—';
  return OTA_STATUS_TEXT[String(value)] || String(value);
}

function applyTheme() {
  let theme = '';
  try { theme = localStorage.getItem(bridge.STORAGE.theme) || ''; } catch { /* 隐私模式 */ }
  if (!theme) theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.dataset.theme = theme;
  $('btn-theme').textContent = theme === 'dark' ? '浅色' : '深色';
}

/* ============================ 请求封装 ============================ */
function fillPath(ep, pathParams = {}) {
  return String(ep.path).replace(/\{(\w+)\}/g, (_, key) => encodeURIComponent(pathParams[key] ?? state[key] ?? ''));
}

async function api(key, { query = {}, body, method, pathParams, panelTag, auth = 'token' } = {}) {
  const ep = EP[key];
  if (!ep) throw new Error(`未知端点 ${key}`);
  const path = fillPath(ep, pathParams);
  const upper = String(method || ep.method || 'GET').toUpperCase();
  const tag = panelTag === undefined ? (ep.panelTag || '') : panelTag;
  const started = performance.now();
  try {
    const result = await bridge.request({ path, query, method: upper, body, panelTag: tag, auth });
    const ms = Math.round(performance.now() - started);
    logLine(`${upper} ${key} ${result.panel ? `[panel:${result.panelTag}]` : path} → ${result.http || result.code || '?'} ${ms}ms`, !result.ok);
    return result;
  } catch (error) {
    logLine(`${upper} ${key} 失败：${error.message}`, true);
    throw error;
  }
}

/** 面板部分 tag 参数名不同：优先 panelTag，失败再退回签名直连。 */
async function apiWithFallback(key, { query = {}, body, method, pathParams } = {}) {
  const ep = EP[key];
  if (!ep?.panelTag) return api(key, { query, body, method, pathParams });
  const first = await api(key, { query, body, method, pathParams });
  if (first.ok || first.http === 401) return first;
  logLine(`${key}：面板 tag 未命中（${first.code || first.http}），改用签名直连`);
  return api(key, { query, body, method, pathParams, panelTag: '' });
}

/* ============================ 车辆 ============================ */
async function loadVehicles() {
  const result = await apiWithFallback('vehicles');
  const list = Array.isArray(result.data) ? result.data : (result.data?.list || []);
  state.vehicles = list.map((v) => ({
    vin: String(v.vin ?? v.vinNo ?? ''),
    name: String(v.vehicleName ?? v.name ?? v.vehicleType ?? ''),
    model: String(v.vehicleType ?? v.modelName ?? ''),
    plate: String(v.plateNumber ?? ''),
    raw: v,
  })).filter((v) => v.vin);
  const saved = bridge.vin || '';
  state.vin = state.vehicles.some((v) => v.vin === saved) ? saved : (state.vehicles[0]?.vin || '');
  if (state.vin) bridge.setVin(state.vin);
  renderVehicleSelect();
}

function renderVehicleSelect() {
  const select = $('vin-select');
  if (!state.vehicles.length) {
    select.innerHTML = '<option value="">（没读到车辆，先在面板登录/绑定）</option>';
    $('vin-meta').textContent = '—';
    return;
  }
  select.innerHTML = state.vehicles.map((v) => {
    const label = [v.name || v.model || '车辆', v.plate].filter(Boolean).join(' · ');
    return `<option value="${esc(v.vin)}"${v.vin === state.vin ? ' selected' : ''}>${esc(label)} · ${esc(v.vin.slice(-6))}</option>`;
  }).join('');
  $('vin-meta').textContent = `${state.vehicles.length} 台车`;
}

async function loadHome() {
  if (!state.vin) return;
  const result = await apiWithFallback('home', { query: { vinNo: state.vin }, pathParams: { vin: state.vin } });
  if (!result.ok) {
    const fallback = await apiWithFallback('carSet', { query: { vinNo: state.vin, carUserId: bridge.uid || state.uid || '', virtualFlag: '0' } });
    if (fallback.ok) state.home = { carSet: fallback.data };
    return;
  }
  state.home = result.data;
  state.summary = pickVehicle(result.data);
  state.uid = String(pickUid(result.data) || state.uid || '');
  if (state.uid) bridge.setUid(state.uid);
}

function pickUid(home) {
  const d = home?.data ?? home ?? {};
  return d.carUserId ?? d.userId ?? d.vehicleInfo?.carUserId ?? d.vehicleInfo?.userId ?? '';
}

/* ============================ 设置 ============================ */
async function loadSettingsData(force = false) {
  if (!state.vin) throw new Error('还没有 VIN');
  if (state.settings?.model && !force) return state.settings;
  const [itemsV2, items, info, btCodes, chargePower] = await Promise.all([
    api('setItemsV2', { query: { vinNo: state.vin, homepageInvoke: '0' } }),
    apiWithFallback('setItems', { query: { vinNo: state.vin, homepageInvoke: '1' } }),
    apiWithFallback('setInfo', { query: { vin: state.vin }, pathParams: { vin: state.vin } }),
    api('btCodes', { query: { vinNo: state.vin } }).catch(() => null),
    api('chargePower', { query: { vinNo: state.vin } }).catch(() => null),
  ]);
  if (!info.ok) throw new Error(`设置项读取失败：${info.message || info.code || info.http}`);
  const model = buildSettingsModel({
    itemsV2: itemsV2.ok ? itemsV2.raw : null,
    items: items.ok ? items.raw : null,
    info: info.raw,
    blueToothCodes: btCodes?.ok ? btCodes.raw : null,
    chargePowerOptions: chargePower?.ok ? chargePower.raw : null,
  });
  state.settings = { model, info: info.data, loadedAt: Date.now() };
  return state.settings;
}

function tileIcon(tile) {
  const map = {
    KEY_SHARE: '🔑', DRIVING_MODE_SETTING: '🛣️', QUICK_RIDE: '🏍️', ASSIST_DRIVING: '🧭',
    COME_HOME_WITH_YOU: '💡', AUTOMATIC_PARKING_GO: '🅿️', AVOID_THEFT_SECURITY: '🛡️',
    AUDIO_SET: '🔊', CUSTOM_KEY_SET: '🎛️', INSTRUMENT_SET: '📟', BATTERY_INFO_AND_SETTINGS: '🔋',
    SMART_PART: '📱', VEHICLE_INFO: 'ℹ️', FUNCTION_WISH_FOUNTAIN: '💭',
  };
  return map[tile.code] || '⚙️';
}

function renderSettings() {
  const view = $('view');
  const data = state.settings;
  if (!data?.model) {
    view.innerHTML = '<section class="card"><div class="empty">正在读取车辆设置…</div></section>';
    return;
  }
  const { model } = data;
  const stats = summarize ? summarize(model) : model.stats || {};
  const updated = fmtTime(model.updatedAt || state.settings.info?.updateDate || '');
  const grouped = new Set((model.tiles || []).flatMap((tile) => (tile.items || []).map((item) => item.code)));
  const looseItems = (model.items || []).filter((item) => !grouped.has(item.code));
  const rowsHtml = (model.rows || []).map((row) => `
    <div class="tile-row">
      ${(row.tiles || []).map((tile) => `
        <button class="tile${tile.available ? '' : ' dim'}" type="button" data-tile="${esc(tile.code)}">
          <em>${tileIcon(tile)}</em>
          <b>${esc(tile.name)}</b>
          <span>${esc(tile.describe || ([...new Set((tile.items || []).map((it) => it.label))].slice(0, 3).join('、') || '这台车未开放'))}</span>
        </button>
      `).join('')}
    </div>
  `).join('');

  view.innerHTML = `
    <section class="card">
      <div class="card-head">
        <h2>车辆设置</h2>
        <span class="sub">结构取自官方 App 3.0.6 的 itemsV2</span>
      </div>
      <div class="card-body">
        <p class="hint">${esc(stats.total ?? 0)} 项能力 · 可写 ${esc(stats.writable ?? 0)} 项
          ${stats.unsupported ? `· 本车不支持 ${esc(stats.unsupported)} 项` : ''}${updated ? ` · 车端同步于 ${esc(updated)}` : ''}</p>
      </div>
    </section>
    <section class="card">
      <div class="card-head"><h2>设置项</h2><span class="sub">点磁贴进入</span></div>
      <div class="card-body" style="display:grid;gap:14px">${rowsHtml || '<div class="empty">没有读到设置项</div>'}</div>
    </section>
    ${renderWallpaperEntry()}
    ${looseItems.length ? `<section class="card">
      <div class="card-head"><h2>其他设置项</h2><span class="sub">能力表里有、官方主页没挂磁贴</span></div>
      <div class="card-body">
        <button class="btn" type="button" id="open-loose">展开 ${looseItems.length} 项</button>
      </div>
    </section>` : ''}
    ${renderRawSettings()}
    ${renderAdvancedSettings()}
  `;

  for (const button of view.querySelectorAll('[data-tile]')) {
    button.addEventListener('click', () => openTile(button.dataset.tile));
  }
  $('open-loose')?.addEventListener('click', () => openItemsSheet('其他设置项', '未挂进官方磁贴的能力项', looseItems));
  $('wall-open')?.addEventListener('click', () => showTab('wallpaper'));
  $('wall-edit')?.addEventListener('click', () => openWallpaperEdit());
  $('wall-upload-entry')?.addEventListener('click', async () => { await showTab('wallpaper'); $('wall-file')?.click(); });

}

function renderRawSettings() {
  const info = state.settings?.info;

    <section class="card">

          <summary>原始值 vehicleSetInfo（排障用）</summary>

        </details>

function renderAdvancedSettings() {
  const targets = [
    ['addSet', 'addVehicleSet（开关类写入，官方 App 主路径）'],
    ['propOne', 'propertyOne/one（通用属性一）'],
    ['propTwo', 'propertyTwo/one（通用属性二）'],
    ['motoPlay', 'motoPlay/one（投屏模式）'],
    ['lowPowerRule', 'lowPowerRule/one（低电量规则）'],
  ];
  return `
    <section class="card">
      <div class="card-head"><h2>高级写入</h2><span class="sub">未验证的接口，自己确认参数</span></div>
      <div class="card-body">
        <div class="field">
          <label for="adv-target">接口</label>
          <select id="adv-target">${targets.map(([key, label]) => `<option value="${key}">${esc(label)}</option>`).join('')}</select>
        </div>
        <div class="field">
          <label for="adv-body">请求体 JSON</label>
          <textarea id="adv-body" spellcheck="false"></textarea>
        </div>
        <p class="hint">addVehicleSet 的字段来自 3.0.6 dex 的 <span class="mono">AddVehicleSetReq</span>：
          <span class="mono">{vin, serviceCode, vehicleSetEnum, commandParam, flag, message}</span>。
          serviceCode 取自 <span class="mono">blueToothServiceCode</span>，缺了会被车端拒。</p>
        <div class="btnrow"><button class="btn danger" type="button" id="adv-run">执行写入</button></div>
      </div>
    </section>`;
}

function wireAdvancedSettings() {
  const target = $('adv-target');
  const body = $('adv-body');
  if (!target || !body) return;
  const preset = () => {
    const key = target.value;
    if (key === 'addSet') {
      const first = (state.settings?.model?.items || []).find((it) => it.writable && it.serviceCode);
      body.value = JSON.stringify(buildWriteBody
        ? buildWriteBody(first, first?.value, { vin: state.vin })
        : { vin: state.vin, serviceCode: '', vehicleSetEnum: '', commandParam: '', flag: true, message: '' }, null, 2);
    } else if (key === 'motoPlay') {
      body.value = JSON.stringify({ vinNo: state.vin, motoPlay: state.settings?.info?.motoPlay ?? 1 }, null, 2);
    } else if (key === 'lowPowerRule') {
      body.value = JSON.stringify({ vinNo: state.vin, lowPower: state.settings?.info?.lowPower ?? 10, lowPowerRule: state.settings?.info?.lowPowerRule ?? null }, null, 2);
    } else {
      body.value = JSON.stringify({ vinNo: state.vin, propertyName: '', propertyValue: '' }, null, 2);
    }
  };
  target.addEventListener('change', preset);
  if (!body.value) preset();
  $('adv-run').addEventListener('click', () => {
    let payload;
    try { payload = JSON.parse(body.value); } catch (error) { toast(`JSON 不合法：${error.message}`); return; }
    const key = target.value;
    const ep = EP[key];
    confirmWrite({
      title: `执行 ${ep.method} ${ep.path.split('/').pop()}`,
      sub: '高级写入不会做字段校验，请自行确认',
      body: `<pre class="log" style="max-height:220px;overflow:auto">${esc(JSON.stringify(payload, null, 2))}</pre>`,
      run: async () => {
        const result = await api(key, { query: key === 'addSet' ? {} : { vinNo: state.vin }, body: payload });
        if (!result.ok) throw new Error(result.message || result.code || `HTTP ${result.http}`);
        toast('已提交');
        await refreshSettings(true);
      },
    });
  });
}

function openTile(code) {
  const tile = (state.settings?.model?.tiles || []).find((t) => t.code === code);
  if (!tile) return;
  openItemsSheet(tile.name, tile.describe || `${(tile.items || []).length} 项`, tile.items || [], () => openTile(code));
}

/** 磁贴与「其他设置项」共用同一套渲染/写入逻辑。 */
function openItemsSheet(title, sub, items, reload) {
  $('sheet-title').textContent = title;
  $('sheet-sub').textContent = sub;
  const body = $('sheet-body');
  body.innerHTML = (items || []).map((item, index) => renderItemRow(item, index)).join('')
    || '<div class="empty">这台车没有开放这一组</div>';
  $('sheet-foot').innerHTML = '<button class="btn ghost" type="button" id="sheet-refresh">刷新当前值</button><span class="hint" style="flex:1">改完会自动重读</span>';
  $('sheet-refresh').addEventListener('click', async () => {
    await refreshSettings(true);
    (reload || (() => openItemsSheet(title, sub, items, reload)))();
  });
  for (const el of body.querySelectorAll('[data-item]')) {
    wireItemControl(el, { items });
  }
  $('sheet').showModal();
}

function controlLabel(item) {
  switch (item.control) {
    case CONTROL.SWITCH: return toBool(item.value) ? '开' : '关';
    case CONTROL.SELECT: {
      const opt = (item.options || []).find((o) => String(o.value) === String(item.value));
      return opt?.label ?? String(item.value ?? '—');
    }
    case CONTROL.RANGE: return `${item.value ?? '—'}${item.unit || ''}`;
    case CONTROL.READONLY: return String(item.value ?? '—');
    default: return String(item.value ?? '—');
  }
}

function renderItemRow(item, index) {
  const id = `it-${index}`;
  const locked = !item.writable || Boolean(item.disabledReason);
  const reason = item.disabledReason ? `<small>${esc(item.disabledReason)}</small>` : (item.note ? `<small>${esc(item.note)}</small>` : '');
  let control = '';
  if (item.control === CONTROL.SWITCH) {
    const on = toBool(item.value);
    control = `<button class="switch" type="button" role="switch" data-item="${id}" data-kind="switch" aria-checked="${on ? 'true' : 'false'}" ${locked ? 'disabled' : ''}></button>`;
  } else if (item.control === CONTROL.SELECT) {
    control = `<select class="ctl" data-item="${id}" data-kind="select" ${locked ? 'disabled' : ''}>
      ${(item.options || []).map((o) => `<option value="${esc(o.value)}"${String(o.value) === String(item.value) ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}
    </select>`;
  } else if (item.control === CONTROL.RANGE) {
    control = `<input class="ctl" type="range" data-item="${id}" data-kind="range" min="${item.min ?? 0}" max="${item.max ?? 100}" step="${item.step ?? 1}" value="${esc(item.value ?? item.min ?? 0)}" ${locked ? 'disabled' : ''}>
      <span class="val" data-val="${id}">${esc(controlLabel(item))}</span>`;
  } else if (item.control === CONTROL.TEXT) {
    control = `<input class="ctl" type="text" data-item="${id}" data-kind="text" value="${esc(item.value ?? '')}" ${locked ? 'disabled' : ''}>`;
  } else {
    control = `<span class="val">${esc(controlLabel(item))}</span>`;
  }
  return `
    <div class="item${locked ? ' locked' : ''}" data-row="${id}">
      <div class="txt">
        <b>${esc(item.label)} ${item.serviceCode ? `<span class="badge mono">${esc(item.serviceCode)}</span>` : ''}</b>
        ${reason}
      </div>
      ${control}
    </div>`;
}

function wireItemControl(root, tile) {
  for (const el of root.querySelectorAll('[data-item]')) {
    const item = tile.items[Number(String(el.dataset.item).slice(3))];
    if (!item) continue;
    const kind = el.dataset.kind;
    if (kind === 'switch') {
      el.addEventListener('click', () => {
        const next = !toBool(item.value);
        askWrite(item, next ? 1 : 0);
      });
    } else if (kind === 'select') {
      el.addEventListener('change', () => askWrite(item, coerceValue ? coerceValue(item, el.value) : el.value));
    } else if (kind === 'range') {
      const out = root.querySelector(`[data-val="${el.dataset.item}"]`);
      el.addEventListener('input', () => { if (out) out.textContent = `${el.value}${item.unit || ''}`; });
      el.addEventListener('change', () => askWrite(item, coerceValue ? coerceValue(item, el.value) : Number(el.value)));
    } else if (kind === 'text') {
      el.addEventListener('change', () => askWrite(item, el.value));
    }
  }
}

function askWrite(item, nextValue) {
  if (!item.serviceCode) {
    toast('这项没有 serviceCode（服务端没下发），写入不了；可试「高级写入」里的 propertyOne/one', 3600);
    return;
  }
  const payload = buildWriteBody(item, nextValue, { vin: state.vin });
  confirmWrite({
    title: `写入「${item.label}」`,
    sub: `${controlLabel(item)} → ${String(nextValue)}`,
    body: `<pre class="log">${esc(JSON.stringify(payload, null, 2))}</pre>
      <p class="hint">addVehicleSet 的字段名来自 App 3.0.6 dex；写入成功与否以车端返回为准。</p>`,
    run: async () => {
      const result = await api('addSet', { body: payload });
      if (!result.ok) throw new Error(result.message || result.code || `HTTP ${result.http}`);
      toast('已提交，等车端生效…');
      await new Promise((resolve) => setTimeout(resolve, 800));
      await refreshSettings(true);
    },
  });
}

async function refreshSettings(force = true) {
  try {
    await loadSettingsData(force);
    renderSettings();
    if ($('sheet').open) {
      const title = $('sheet-title').textContent;
      const tile = (state.settings?.model?.tiles || []).find((t) => t.name === title);
      if (tile) openTile(tile.code);
    }
  } catch (error) {
    toast(`刷新失败：${error.message}`);
  }
}

/* ============================ 壁纸 ============================ */
async function loadWallpaper(force = false) {
  if (!state.vin) throw new Error('还没有 VIN');
  if (state.wallpaper.loaded && !force) return state.wallpaper;
  const home = state.home || {};
  const fromHome = wallpapersFromHome ? wallpapersFromHome(home) : { supported: null, builtin: [] };
  const [page, count] = await Promise.all([
    api('wallPage', { query: { vinNo: state.vin, pageNum: '1', pageSize: '50' } }).catch((error) => ({ ok: false, message: error.message })),
    api('wallCount', { query: { vinNo: state.vin } }).catch(() => null),
  ]);
  state.wallpaper = {
    ...state.wallpaper,
    meta: fromHome,
    list: page.ok ? (normalizeWallpaperPage ? normalizeWallpaperPage(page.raw).list : []) : [],
    total: page.ok ? (normalizeWallpaperPage ? normalizeWallpaperPage(page.raw).total : 0) : 0,
    pageError: page.ok ? '' : (page.message || '壁纸列表读取失败'),
    count: count?.ok ? Number(count.data) : null,
    loaded: true,
  };
  return state.wallpaper;
}

      <span class="name">${esc(b.name || '内置壁纸')}</span>

          <button class="btn ghost" type="button" id="wall-home">重读车况字段</button>
        </div>
        <p class="hint" style="margin-top:8px">上传走 App 的 multipart 接口（<span class="mono">wallpaper/save</span>），

/** 壁纸「修改」入口：改名/改配置（车辆设置页按钮进来）。 */
async function openWallpaperEdit(preselectId) {

  }

    return;
  }
  const current = list.find((w) => String(w.id) === String(preselectId)) || list[0];
  $('sheet-title').textContent = '修改壁纸信息';
  $('sheet-sub').textContent = `共 ${list.length} 张 · 改名会同步到账号`;
  $('sheet-body').innerHTML = `
    <div class="field">
      <label for="we-pick">选择壁纸</label>
      <select id="we-pick">
        ${list.map((w) => `<option value="${esc(w.id)}"${String(w.id) === String(current.id) ? ' selected' : ''}>${esc(w.name || `#${w.id}`)}${w.inUse ? '（使用中）' : ''}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label for="we-name">新的壁纸名称</label>
      <input id="we-name" maxlength="24" value="${esc(current.name || '')}" placeholder="不超过 24 个字符">
    </div>
    <div class="field">
      <label for="we-method">请求方法</label>
      <select id="we-method">
        <option value="POST" selected>POST（官方清单）</option>
        <option value="PUT">PUT（早期文档）</option>
      </select>
    </div>
    <details class="raw">
      <summary>请求体（可改，默认只带 wallpaperName + vinNo）</summary>
      <textarea id="we-body" spellcheck="false">${esc(JSON.stringify({ wallpaperName: current.name || '', vinNo: state.vin }, null, 2))}</textarea>
    </details>
    <p class="hint" style="margin-top:8px">接口没有真机验证过：返回 40004 多半是字段名不对，返回 30121 是签名/网关问题。</p>`;
  $('sheet-foot').innerHTML = '<button class="btn ghost" type="button" id="we-cancel">取消</button><button class="btn primary" type="button" id="we-save">保存修改</button>';

  const pick = $('we-pick');
  pick.addEventListener('change', () => {
    const wall = list.find((w) => String(w.id) === String(pick.value));
    if (!wall) return;
    $('we-name').value = wall.name || '';
    $('we-body').value = JSON.stringify({ wallpaperName: wall.name || '', vinNo: state.vin }, null, 2);
  });
  $('we-name').addEventListener('input', () => {
    try {
      const body = JSON.parse($('we-body').value);
      body.wallpaperName = $('we-name').value;
      $('we-body').value = JSON.stringify(body, null, 2);
    } catch { /* 用户改坏了就先不动 */ }
  });
  $('we-cancel').addEventListener('click', () => $('sheet').close());
  $('we-save').addEventListener('click', () => {
    const id = pick.value;
    const method = $('we-method').value;
    let payload;
    try { payload = JSON.parse($('we-body').value); } catch (error) { toast(`请求体不是合法 JSON：${error.message}`); return; }
    if (!String(payload.wallpaperName || '').trim()) { toast('名称不能为空'); return; }
    $('sheet').close();
    confirmWrite({
      title: '修改壁纸信息',
      sub: `${method} update/${id}`,
      body: `<pre class="log">${esc(JSON.stringify(payload, null, 2))}</pre>
        <p class="hint">这是写操作：会改账号下的壁纸记录，不影响车机上正在用的那张。</p>`,
      run: async () => {
        const result = await api('wallUpdate', { pathParams: { id }, method, body: payload });
        if (!result.ok) throw new Error(result.message || result.code || `HTTP ${result.http}`);
        toast('已保存');
        await loadWallpaper(true);
        rerender();
      },
    });
  });
  $('sheet').showModal();
}

function openWallpaper(id) {

    </dl>

function applyWallpaper(wall) {
  const payload = buildUseWallpaperBody ? buildUseWallpaperBody(wall.id, state.vin) : { id: wall.id, vinNo: state.vin };
  confirmWrite({
    title: '下发壁纸到车机',
    sub: '车机在线时才会生效',
    body: `<pre class="log">${esc(JSON.stringify(payload, null, 2))}</pre>`,
    run: async () => {
      const result = await api('wallUse', { body: payload });
      if (!result.ok) throw new Error(result.message || result.code || `HTTP ${result.http}`);
      const recordId = result.data?.recordId ?? result.data?.id ?? result.data;
      toast('已下发，开始看进度');
      if (recordId && typeof recordId !== 'object') pollWallpaperProgress(String(recordId));
    },
  });
}

function deleteWallpaper(wall) {
  confirmWrite({
    title: '删除壁纸',
    sub: `#${wall.id} ${wall.name || ''}`,
    body: '<p class="hint">从账号里删掉这张自定义壁纸，不可恢复。</p>',
    run: async () => {
      const result = await api('wallDelete', { pathParams: { id: wall.id }, query: { vinNo: state.vin } });
      if (!result.ok) throw new Error(result.message || result.code || `HTTP ${result.http}`);
      toast('已删除');
      await loadWallpaper(true);
      renderWallpaper();
    },
  });
}

async function pollWallpaperProgress(recordId) {
  const card = $('wall-progress-card');
  if (card) card.hidden = false;
  const bar = $('wall-progress-bar');
  const text = $('wall-progress-text');
  const sub = $('wall-progress-sub');
  if (sub) sub.textContent = `recordId ${recordId}`;
  for (let i = 0; i < 40; i += 1) {
    const result = await api('wallProgress', { pathParams: { recordId } }).catch(() => null);
    const progress = result?.ok && normalizeProgress ? normalizeProgress(result.raw) : null;
    if (bar) bar.style.width = `${progress?.percent ?? 0}%`;
    if (text) text.textContent = progress?.message || (progress?.done ? '完成' : '等待车机…');
    if (progress?.done) break;
    await new Promise((resolve) => setTimeout(resolve, 1500));
  }
  await loadWallpaper(true);
  renderWallpaper();
}

async function uploadWallpaper(file) {
  if (!file) return;
  if (!state.vin) { toast('还没有 VIN'); return; }
  const url = buildUrl(bridge.base(), fillPath(EP.wallSave), { vinNo: state.vin });
  const form = new FormData();
  form.append('file', file, file.name);
  form.append('wallpaperName', file.name.replace(/\.[^.]+$/, '').slice(0, 24));
  form.append('vinNo', state.vin);
  confirmWrite({
    title: '上传自定义壁纸',
    sub: `${file.name} · ${formatBytes ? formatBytes(file.size) : file.size}`,
    body: `<p class="hint">multipart 上传：字段 <span class="mono">file</span> / <span class="mono">wallpaperName</span> / <span class="mono">vinNo</span>。
      签名按空 body 计算（官方没公开 multipart 的签名体），失败多半是签名体不匹配。</p>`,
    run: async () => {
      const headers = await bridge.signHeaders({ url, method: 'POST', bodyText: '' });
      delete headers['Content-Type'];
      const response = await fetch(url, { method: 'POST', headers, body: form, cache: 'no-store' });
      const text = await response.text();
      logLine(`POST wallpaper/save → ${response.status}`, response.status >= 300);
      let data = null;
      try { data = JSON.parse(text); } catch { /* 非 JSON */ }
      if (!(response.ok && (data?.code === '10000' || data?.code === undefined))) {
        throw new Error(data?.message || `HTTP ${response.status}`);
      }
      toast('已上传');
      await loadWallpaper(true);
      renderWallpaper();
    },
  });
}

/* ============================ OTA ============================ */
async function loadOta(force = false) {
  if (!state.vin) throw new Error('还没有 VIN');
  if (state.ota.loadedAt && !force) return state.ota;
  const [info, list, record, content, redPoint, upstatus] = await Promise.all([
    api('otaInfo', { query: { vinNo: state.vin } }).catch(() => null),
    api('otaList', { query: { vinNo: state.vin } }).catch(() => null),
    apiWithFallback('otaRecord', { query: { vinNo: state.vin } }).catch(() => null),
    api('otaRedContent', { query: { vinNo: state.vin } }).catch(() => null),
    api('otaRedPoint', { query: { vinNo: state.vin } }).catch(() => null),
    api('otaUpstatus', { query: { vinNo: state.vin } }).catch(() => null),
  ]);
  state.ota = {
    info: info?.ok && normalizeOtaInfo ? normalizeOtaInfo(info.raw) : (info ? { present: false } : null),
    list: list?.ok && normalizeOtaList ? normalizeOtaList(list.raw) : null,
    record: record?.ok && normalizeOtaRecord ? normalizeOtaRecord(record.raw) : null,
    content: content?.ok ? content.data : null,
    redPoint: redPoint?.ok ? redPoint.data : null,
    status: upstatus?.ok && normalizeOtaStatus ? normalizeOtaStatus(upstatus.raw) : null,
    loadedAt: Date.now(),
  };
  return state.ota;
}

    </section>`;
}

function wireOtaAdvanced() {
  for (const button of $('view').querySelectorAll('[data-ota]')) {
    button.addEventListener('click', async () => {
      const key = button.dataset.ota;
      const out = $('ota-extra');
      out.textContent = '请求中…';
      const result = await api(key, { query: { vinNo: state.vin } }).catch((error) => ({ ok: false, message: error.message }));
      out.textContent = JSON.stringify(result.raw ?? { ok: result.ok, message: result.message }, null, 2);
    });
  }
}

async function runCheckVersion() {
  const target = state.ota.info?.softwareVersion || '';
  const result = await api('checkVersion', { query: { vinNo: state.vin, targetVersion: target || '0' } }).catch((error) => ({ ok: false, message: error.message }));
  if (!result.ok) { toast(`checkVersion 失败：${result.message || result.code}`); return; }
  const check = normalizeCheckVersion ? normalizeCheckVersion(result.raw, { currentVersion: target }) : { hasUpdate: Boolean(result.data) };
  state.ota.check = check;
  $('ota-check-hint').textContent = check.hasUpdate ? `有新版：${check.targetVersion || '（看 fileInfo）'}` : '已是最新（checkVersion 返回 false）';
  toast(check.hasUpdate ? '有更新' : '已是最新');
}

/* ============================ 确认弹层 ============================ */
let confirmRun = null;
function confirmWrite({ title, sub, body, run, actionLabel = '执行' }) {
  confirmRun = run;
  $('cf-title').textContent = title;
  $('cf-sub').textContent = sub || '';
  $('cf-body').innerHTML = body || '';
  $('cf-check').checked = false;
  $('cf-ok').disabled = true;
  $('cf-ok').textContent = actionLabel;
  $('confirm-dialog').showModal();
}

/* ============================ 视图切换 ============================ */
/** 按当前 tab 重绘（从别的页触发的写操作不要直接 renderWallpaper，会把视图切走）。 */
function rerender() {
  if (state.tab === 'settings') renderSettings();
  else if (state.tab === 'wallpaper') renderWallpaper();
  else renderOta();
}

async function showTab(tab) {
  state.tab = tab;
  for (const button of document.querySelectorAll('.tabbar button')) {
    button.setAttribute('aria-selected', String(button.dataset.tab === tab));
  }
  // 深链接：api.html / 面板入口用 #wallpaper、#ota 直接落到对应页。
  try {
    if (location.hash !== `#${tab}`) history.replaceState(null, '', `${location.pathname}${location.search}#${tab}`);
  } catch { /* file:// 或沙箱里可能禁用 */ }
  if (!bridge.token) { renderLoginGate(); return; }
  if (!state.vin) {
    try { await loadVehicles(); } catch (error) { toast(`车辆列表失败：${error.message}`); }
  }
  try {
    if (tab === 'settings') {
      await loadSettingsData(false);
      renderSettings();
    } else if (tab === 'wallpaper') {
      await loadHome();
      await loadWallpaper(false);
      renderWallpaper();
    } else {
      await loadOta(false);
      renderOta();
    }
  } catch (error) {
    $('view').innerHTML = `<section class="card"><div class="empty">${esc(error.message)}</div></section>`;
  }
}

function renderLoginGate() {
  setState('bad', '未登录');
  $('view').innerHTML = `
    <section class="notice">
      <div>
        <b>还没有登录态</b>
        <p>本页与面板共用 <span class="mono">localStorage['zeeho.token']</span>。先在面板用手机号登录一次，回来点刷新即可；也可以直接粘贴 token。</p>
      </div>
    </section>
    <section class="card"><div class="card-body">
      <div class="field"><label for="gate-token">粘贴 Bearer token</label><input id="gate-token" placeholder="面板登录后自动同步；也可从 App 抓包粘贴"></div>
      <div class="btnrow">
        <button class="btn primary" type="button" id="gate-save">保存并刷新</button>
        <a class="btn" href="./index.html">打开面板登录</a>
        <button class="btn ghost" type="button" id="gate-panel">用面板签名载入登录态</button>
      </div>
    </div></section>`;
  $('gate-save').addEventListener('click', async () => {
    const token = $('gate-token').value.trim();
    if (!token) { toast('先粘贴 token'); return; }
    bridge.setToken(token);
    await boot();
  });
  $('gate-panel').addEventListener('click', async () => {
    const ok = await bridge.loadPanel();
    if (!ok || !bridge.token) { toast('面板里也没有登录态'); return; }
    await boot();
  });
}

/* ============================ 启动 ============================ */
function wireShell() {
  for (const button of document.querySelectorAll('.tabbar button')) {
    button.addEventListener('click', () => showTab(button.dataset.tab));
  }
  window.addEventListener('hashchange', () => {
    const tab = location.hash.replace('#', '');
    if (['settings', 'wallpaper', 'ota'].includes(tab) && tab !== state.tab) showTab(tab);
  });
  $('vin-select').addEventListener('change', async (event) => {
    state.vin = event.target.value;
    bridge.setVin(state.vin);
    state.settings = null;
    state.wallpaper.loaded = false;
    state.ota.loadedAt = 0;
    await loadHome();
    await showTab(state.tab);
  });
  $('btn-refresh').addEventListener('click', async () => { await showTab(state.tab); toast('已刷新'); });
  $('btn-theme').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem(bridge.STORAGE.theme, next); } catch { /* 隐私模式 */ }
    $('btn-theme').textContent = next === 'dark' ? '浅色' : '深色';
  });
  $('btn-log').addEventListener('click', () => { $('log-body').textContent = state.logs.join('\n') || '（空）'; $('log-dialog').showModal(); });
  $('log-close').addEventListener('click', () => $('log-dialog').close());
  $('sheet-close').addEventListener('click', () => $('sheet').close());
  $('settings-close').addEventListener('click', () => $('settings-dialog').close());

  $('btn-settings').addEventListener('click', () => {
    const cfg = bridge.state.cfg;
    $('cfg-mode').value = bridge.mode || 'panel';
    $('cfg-base').value = cfg.base || '';
    $('cfg-appid').value = cfg.appId || '';
    $('cfg-secret').value = cfg.appSecret || '';
    $('cfg-token').value = bridge.token || '';
    $('cfg-uid').value = bridge.uid || '';
    $('settings-dialog').showModal();
  });
  $('cfg-save').addEventListener('click', async () => {
    bridge.saveSettings({
      mode: $('cfg-mode').value,
      base: $('cfg-base').value,
      appId: $('cfg-appid').value.trim(),
      appSecret: $('cfg-secret').value.trim(),
    });
    bridge.setToken($('cfg-token').value.trim());
    bridge.setUid($('cfg-uid').value.trim());
    $('settings-dialog').close();
    toast('已保存');
    await boot();
  });
  $('cfg-open-panel').addEventListener('click', () => location.assign('./index.html'));
  $('cfg-clear').addEventListener('click', async () => {
    bridge.setToken('');
    toast('已清除 token');
    await boot();
  });

  $('cf-cancel').addEventListener('click', () => { $('confirm-dialog').close(); confirmRun = null; });
  $('cf-check').addEventListener('change', (event) => { $('cf-ok').disabled = !event.target.checked; });
  $('cf-ok').addEventListener('click', async () => {
    const run = confirmRun;
    $('confirm-dialog').close();
    confirmRun = null;
    if (!run) return;
    try {
      setState('warn', '写入中…');
      await run();
      setState('ok', '已登录');
    } catch (error) {
      toast(`失败：${error.message}`);
      setState('bad', '写入失败');
    }
  });
}

async function boot() {
  bridge.loadSettings();
  const hashTab = location.hash.replace('#', '');
  if (['settings', 'wallpaper', 'ota'].includes(hashTab)) state.tab = hashTab;
  if (!bridge.token) {
    // 面板模式先试着借面板载入 token（面板登录过的浏览器不用手动粘）。
    if (bridge.mode === 'panel') {
      try { await bridge.loadPanel(4000); } catch { /* ignore */ }
    }
  }
  if (!bridge.token) { renderLoginGate(); return; }
  setState('ok', '已登录');
  try {
    await loadVehicles();
    await loadHome();
  } catch (error) {
    toast(`初始化失败：${error.message}`);
  }
  await showTab(state.tab);
}

applyTheme();
wireShell();
boot();
</script>
